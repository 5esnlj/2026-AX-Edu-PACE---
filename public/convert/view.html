<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가나다 계단 · 수업 자료</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&family=Noto+Sans:wght@400;600&family=Noto+Sans+KR:wght@400;600;800&display=swap">
<style>
/* Layout: 서비스 설정 막대(테마 따름) → 원본 교과서 2쪽을 그대로 옮긴 '종이' 지면(항상 밝은 종이) → 하단 학생 도구 막대 */
:root{
  /* 서비스 화면 토큰: 팀원 화면(styles.css)과 같은 값. 교사 = 파랑, 학생 = 초록 */
  --blue:#3B8FE0; --green:#3DBB74; --yellow:#FFC93A; --orange:#F7962F; --red:#F2554A; --purple:#9B5BD6;
  --teal-600:#2A72BF; --teal-500:#3B8FE0; --teal-300:#E4EFFB; --lemon-500:#FFC93A; --red-500:#D93A33; --red-300:#FDE4E2; --amber-500:#C47314; --amber-300:#FDF0DC; --ok-300:#E3F4EA;
  --bg:#F4F6F8; --card:#FFFFFF; --chip:#EEF2F5; --line:#DFE5EA; --muted:#66737F; --sub:#4F5B66; --fg:#1D2733; --title:#1D2733; --on:#FFFFFF;
  /* 원본 교과서 지면 토큰 (원본 색 유지, 테마와 무관한 종이) */
  --p-paper:#FFFFFF; --p-ink:#2B3138; --p-ink2:#4A525A; --p-teal:#1E8C86; --p-teal-l:#D2ECEB; --p-yellow:#FCE08E; --p-yellow-l:#FDF4D8;
  --p-purple:#5A4AA0; --p-green-l:#EEF5E3; --p-red:#E2583A; --p-gray:#9AA3AB; --p-mint:#E7F4F2;
  /* 변환 표시 */
  --swap:#BFEBE5; --swap-ink:#0B6F66; --gloss:#6E7A76;
  --font:"IBM Plex Sans KR","Noto Sans KR","Noto Sans","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-display:"Jua","IBM Plex Sans KR",sans-serif;
  --scale:1;
}
body.student{--teal-600:#258A55;--teal-500:#3DBB74;--teal-300:#E3F4EA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171D;--card:#1A2129;--chip:#222B35;--line:#2E3945;--muted:#9AA7B3;--sub:#B7C2CC;--fg:#E7EDF3;--title:#F1F5F8;--teal-600:#7DB6F0;--teal-300:#1C3045;--red-500:#FF6B62;--red-300:#44201E;--amber-500:#F0A54A;--amber-300:#3A2A14;--ok-300:#17352A;color-scheme:dark}
  :root:not([data-theme="light"]) body.student{--teal-600:#6FD39C;--teal-300:#17352A}}
:root[data-theme="dark"]{--bg:#12171D;--card:#1A2129;--chip:#222B35;--line:#2E3945;--muted:#9AA7B3;--sub:#B7C2CC;--fg:#E7EDF3;--title:#F1F5F8;--teal-600:#7DB6F0;--teal-300:#1C3045;--red-500:#FF6B62;--red-300:#44201E;--amber-500:#F0A54A;--amber-300:#3A2A14;--ok-300:#17352A;color-scheme:dark}
:root[data-theme="dark"] body.student{--teal-600:#6FD39C;--teal-300:#17352A}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:grid;gap:16px}
button{font:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,.swap:focus-visible{outline:2px solid var(--teal-500);outline-offset:2px}

/* 서비스 설정 */
.ctrl{display:grid;gap:12px}
.phead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.phead h1{margin:0;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.3;color:var(--title)}
.phead p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.hbtn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--teal-500);color:#fff}
.hbtn.g{background:var(--chip);color:var(--fg)}
.tabs2{display:flex;gap:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs2 button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs2 button[aria-pressed="true"]{color:var(--title);border-bottom-color:var(--teal-500)}
.tabs2 .count{background:var(--red-500);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.dispbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:grid;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lab{font-size:12px;font-weight:600;color:var(--muted);min-width:44px}
.seg button{border:0;background:var(--chip);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;line-height:1.3}
.seg button small{opacity:.8}
.seg button[aria-pressed="true"]{background:var(--teal-500);color:var(--on);font-weight:600}
.tog{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--fg);font-size:13px;cursor:pointer;padding:2px 0}
.tog .sw{width:32px;height:18px;border-radius:999px;background:var(--line);position:relative}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:left .15s}
.tog[aria-pressed="true"] .sw{background:var(--teal-500)}
.tog[aria-pressed="true"] .sw::after{left:16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub)}
.legend i{font-style:normal;background:var(--swap);color:var(--swap-ink);border-radius:4px;padding:0 4px}

/* 종이 지면 */
.page{background:var(--p-paper);color:var(--p-ink);border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.08);overflow:hidden;position:relative;font-size:calc(16px*var(--scale));line-height:1.85}
.pin{padding:28px clamp(16px,4vw,44px) 22px;display:grid;gap:22px}
.pfoot{display:flex;gap:14px;align-items:baseline;font-size:13px;color:var(--p-ink2)}
.pfoot b{font-size:22px;font-weight:800;color:var(--p-ink)}
.pfoot.r{justify-content:flex-end}

.chap{display:flex;align-items:flex-end;gap:clamp(12px,3vw,28px);margin:-28px 0 0 calc(-1*clamp(16px,4vw,44px))}
.chap .no{background:var(--p-teal);color:#fff;font-weight:800;font-size:clamp(44px,9vw,76px);line-height:1;padding:20px 34px 18px clamp(16px,4vw,44px);border-bottom-right-radius:120px;letter-spacing:-.02em}
.chap .t{flex:1;padding-bottom:10px;min-width:0}
.chap h2{margin:0;font-size:clamp(22px,4.4vw,36px);font-weight:800;line-height:1.2;text-wrap:balance;color:var(--p-ink)}
.chap .bar{height:7px;border-radius:4px;background:var(--p-teal-l);margin-top:10px}
.conn{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.pill{background:var(--p-yellow);color:var(--p-teal);font-weight:800;border-radius:999px;padding:4px 18px;font-size:calc(18px*var(--scale))}
.conn .q{font-weight:600;font-size:calc(18px*var(--scale))}

.storybox{border:4px solid #C9CED3;border-radius:14px;padding:10px;position:relative}
.storytext{background:#fff;border:1px solid #E3E6E9;border-radius:8px;padding:8px 16px;font-size:calc(15px*var(--scale))}
.storytext p{margin:0}
.scene{position:relative;margin-top:6px}
.scene img{display:block;width:100%;border-radius:4px}
.bub{background:#fff;border:1.5px solid var(--p-ink);border-radius:16px;padding:8px 14px;font-size:calc(14px*var(--scale));line-height:1.6}
.bub.s{background:var(--p-mint);border-color:var(--p-teal)}
.bub .who{display:block;font-size:12px;color:var(--p-ink2)}
.bub.s .who{color:var(--p-teal)}
.kids{display:none}
@media (min-width:700px){
  .scene .bub{position:absolute;max-width:32%}
  .b-farmer{left:-4%;top:18%}.b-old{right:-2%;top:4%}.b-st1{left:32%;bottom:-12%}.b-st2{right:-6%;top:58%}
  .kids{display:flex;position:absolute;right:13%;bottom:-20%;gap:0;align-items:flex-end;pointer-events:none}
  .kids img{width:78px}
  .storybox{margin-bottom:44px}
}
@media (max-width:699px){.bubs{display:grid;gap:8px;margin-top:10px}.bub.r{justify-self:end}.bub{max-width:90%;justify-self:start}}
.src{font-size:13px;color:var(--p-ink2)}

.act{display:grid;gap:16px}
.aq{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:start}
.aq .n{width:30px;height:30px;border-radius:50%;background:var(--p-yellow);color:var(--p-teal);font-weight:800;display:grid;place-items:center;font-size:15px}
.aq .stem{padding-top:1px}
.aq .ans{grid-column:2}
.fillbox{background:var(--p-yellow-l);border:1.5px solid var(--p-yellow);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.fillbox input{border:1.5px solid var(--p-teal);border-radius:8px;padding:6px 10px;width:150px;max-width:100%;font:inherit;font-size:calc(15px*var(--scale));background:#fff;color:var(--p-ink)}
.pairbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.pairbox{grid-template-columns:1fr}}
.pb{border:1.5px solid #DADDE0;border-radius:12px;padding:8px 14px;display:flex;align-items:center;gap:10px;min-width:0}
.pb b{color:var(--p-teal);font-weight:800}
.pb input{flex:1;min-width:0;border:0;border-bottom:1px dotted var(--p-gray);font:inherit;font-size:calc(15px*var(--scale));background:transparent;color:var(--p-ink);padding:2px}
.lines{width:100%;box-sizing:border-box;border:0;border-bottom:1px dotted var(--p-gray);background:repeating-linear-gradient(transparent 0 calc(2.2em - 1px),#C9CED3 calc(2.2em - 1px) 2.2em);line-height:2.2em;font:inherit;font-size:calc(15px*var(--scale));color:var(--p-ink);min-height:4.4em;resize:vertical;padding:0 2px}
.fair{font-size:12px;color:var(--p-ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap;line-height:1.5}
.fair .bd{background:var(--lemon-500);color:#1F2725;border-radius:999px;padding:0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid #D5DADE;background:#fff;color:var(--p-ink);border-radius:999px;padding:3px 12px;font-size:calc(14px*var(--scale));cursor:pointer}
.chips button.ok{background:var(--swap);border-color:var(--p-teal)}
.chips button.no{border-color:var(--p-red)}
.fb{font-size:13px;font-weight:600}.fb.ok{color:var(--p-teal)}.fb.no{color:var(--p-red)}

.p2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px 32px}
@media (max-width:700px){.p2{grid-template-columns:1fr}}
.h1row{display:flex;gap:12px;align-items:center}
.h1row .c{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--p-teal);color:var(--p-teal);font-weight:800;display:grid;place-items:center;flex:none}
.h1row h3{margin:0;font-size:calc(22px*var(--scale));font-weight:800;text-wrap:balance;line-height:1.3}
.goal .gh{display:flex;align-items:center;gap:10px;color:#1D5B8F;font-weight:800;font-size:14px}
.goal .gh::after{content:"";flex:1;height:1.5px;background:#1D5B8F}
.goal p{margin:4px 0 0;font-size:calc(14px*var(--scale));line-height:1.7}
.body p{margin:0 0 14px;text-align:justify}
.rl{color:var(--p-teal);font-weight:800;margin-right:6px}
.law{background:var(--p-green-l);border-radius:10px;padding:12px 14px;font-size:calc(14px*var(--scale));line-height:1.75}
.law b{color:#2E6B3E;display:block}
.court img{display:block;width:100%;border-radius:10px;border:2px dashed #C9CED3}
.cap{font-size:calc(14px*var(--scale));line-height:1.7;margin:8px 0 0}
.cap .k{color:#1D5B8F;font-weight:800}
.ast{font-size:calc(14px*var(--scale));line-height:1.7;margin:6px 0 0}
.ast .k{color:var(--p-red);font-weight:800}
.glance{display:grid;gap:12px}
.gh2{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gh2 .pp{background:var(--p-purple);color:#fff;font-weight:800;border-radius:10px;padding:4px 14px}
.gh2 h4{margin:0;font-size:calc(20px*var(--scale));font-weight:800;flex:1;min-width:200px;display:flex;align-items:center;gap:10px}
.gh2 h4::after{content:"";flex:1;height:1.5px;background:var(--p-teal-l)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:700px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{border:1.5px solid #D5DADE;border-radius:10px;overflow:hidden;display:grid;grid-template-rows:auto auto 1fr;min-width:0}
.card .hd{background:var(--p-teal-l);font-weight:800;padding:4px 10px;font-size:calc(14px*var(--scale))}
.card.y .hd{background:var(--p-yellow)}
.card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.card .tx{padding:6px 8px 8px;font-size:calc(13px*var(--scale));line-height:1.6}
.summ{font-size:calc(14px*var(--scale));line-height:1.8;margin:0}

/* 변환 표시 */
.swap{background:linear-gradient(transparent 55%,var(--swap) 55%);color:inherit;cursor:pointer;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.noshow .swap{background:none;cursor:default}
.swap .o{display:none}
.swap.open{display:inline-flex;flex-direction:column;align-items:flex-start;vertical-align:top;background:none}
.swap.open .e,.page .swap.open.edited .e{background:linear-gradient(transparent 55%,#DDDDDD 55%)}
.swap.open .o{display:block;font-size:.78em;line-height:1.35;color:var(--gloss);padding-top:1px;white-space:normal}
ruby{ruby-position:under;ruby-align:center}
ruby rt{font-size:max(10px,.62em);color:var(--gloss);font-weight:400;font-family:"Noto Sans",var(--font);line-height:1.2;letter-spacing:0}
.tm{font-weight:800;cursor:pointer;border:0;background:none;padding:0;color:inherit;font-size:inherit;line-height:inherit}
.more{display:grid;gap:6px;justify-items:start;margin:-6px 0 12px}
.morebtn{border:1px solid var(--p-teal);background:#fff;color:var(--p-teal);border-radius:999px;padding:1px 10px;font-size:12px;cursor:pointer;line-height:1.7}
.morebtn[aria-expanded="true"]{background:var(--p-teal);color:#fff}
.morebox{background:var(--p-mint);border-radius:10px;padding:8px 12px;font-size:calc(14px*var(--scale));line-height:1.75;justify-self:stretch}
.morebox .ml{display:block;font-size:11px;font-weight:600;color:var(--p-teal)}
.vis{background:#fff;border:1.5px solid var(--p-teal-l);border-radius:10px;padding:8px;justify-self:stretch;overflow-x:auto}
.vis svg{display:block;width:100%;min-width:440px;height:auto}
.vis svg text{font-family:var(--font)}

/* 도구 막대·시트 */
.toolbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
.toolbar .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.tb{border:0;background:none;color:var(--sub);font-size:12px;display:grid;justify-items:center;gap:1px;padding:5px 10px;border-radius:10px;cursor:pointer}
.tb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .cnt{font-size:11px;background:var(--lemon-500);color:#1F2725;border-radius:999px;padding:0 6px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:480px;margin:0 auto;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.sheet .t{font-size:19px;font-weight:600;color:var(--title);display:flex;justify-content:space-between;gap:8px}
.sheet .x{border:0;background:var(--chip);border-radius:999px;width:28px;height:28px;color:var(--sub);cursor:pointer}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.sheet dt{color:var(--muted);font-size:12px;font-weight:600;padding-top:2px}
.sheet dd{margin:0}
.btn{border:0;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
.btn.p{background:var(--teal-500);color:var(--on);font-weight:600}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.s{background:var(--chip);color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--title);color:var(--bg);border-radius:999px;padding:7px 16px;font-size:13px;z-index:40}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin:0}
/* 교사 · 오역 판독 */
.tw{display:grid;gap:14px}
.tcard{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:12px}
.tcard h2{margin:0;font-size:18px;font-weight:600;color:var(--title)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.meta dt{color:var(--muted);font-weight:600}.meta dd{margin:0}
.runbtn{justify-self:start;border:0;background:var(--teal-500);color:var(--on);border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
.steps2{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.steps2 li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.steps2 li .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px}
.steps2 li.on{color:var(--title);font-weight:600}.steps2 li.on .d{border-color:var(--teal-500);border-top-color:transparent;animation:spin .8s linear infinite}
.steps2 li.done{color:var(--fg)}.steps2 li.done .d{background:var(--teal-500);border-color:var(--teal-500);color:var(--on)}
@keyframes spin{to{transform:rotate(360deg)}}
.sumrow{display:flex;flex-wrap:wrap;gap:8px}
.sc{border-radius:12px;padding:8px 12px;display:grid;min-width:88px;background:var(--chip)}
.sc b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--title);line-height:1.2}.sc span{font-size:12px;color:var(--sub)}
.sc.r{background:var(--red-300)}.sc.r b{color:var(--red-500)}
.sc.a{background:var(--amber-300)}.sc.a b{color:var(--amber-500)}
.sc.g{background:var(--ok-300)}
.mc{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:10px;border-left:5px solid var(--line)}
.mc.S1{border-left-color:var(--red-500)}.mc.S2{border-left-color:var(--amber-500)}.mc.S3{border-left-color:var(--muted)}
.mh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.sev{border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.sev.S1{background:var(--red-300);color:var(--red-500)}.sev.S2{background:var(--amber-300);color:var(--amber-500)}.sev.S3{background:var(--chip);color:var(--sub)}
.mh .loc{font-size:12px;color:var(--muted)}
.quote{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.9}
.quote mark{background:var(--red-300);color:var(--title);border-radius:3px;padding:0 2px}
.cmpw{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.cmpw > div{border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}

function mastery(g, tier){ return PROFILES[g].academic_korean[TIER_CODE[tier]]; }
function swapInfo(g, o, e){
  const tier = SW_TIER[o] || "unknown_needs_teacher"; const m = mastery(g, tier);
  const op = isNote(o,e) ? "elaborate" : "simplify";
  let why, review = false;
  if (tier === "3"){ why = "교과 적응 한국어(3단계) 어휘가 들어 있어 원문을 그대로 두고 '설명' 버튼으로 추가 설명을 붙였습니다."; }
  else if (op === "elaborate"){ why = `${TIER_NAME[tier]||""} 표현의 뜻을 원문은 그대로 두고 '설명' 버튼으로 덧붙였습니다.`; }
  else if (m == null){ why = "위계 근거가 없어 교사 확인이 필요합니다."; review = true; }
  else why = `${TIER_NAME[tier]}(${tier}) 표현입니다. 이 학생의 해당 위계 숙달 단계가 M${m}${m>=6?"로 안정 단계이지만 그룹 기준에 따라 바꿨습니다":"로 안정 단계(M6) 전이라 "+(op==="elaborate"?"상세화했습니다":"하위 단계 표현으로 바꿨습니다")}.`;

function decision(g){
  const p = PROFILES[g], subj = p.subject["사회"], methods = [], why = [], warns = [], qs = [];
  why.push(`프로필의 진단 수준(${p.overall_korean_level})과 위계별 숙달도를 기준으로 어휘를 유지하거나 바꿉니다.`);
  methods.push("핵심어 모국어 병기"); why.push(`번역 언어는 프로필의 모국어(${p.native_language})를 사용합니다.`);
  if (p.daily_korean_support){ methods.push("쉬운 한국어"); why.push("생활 한국어 지원이 필요해 쉬운 표현과 짧은 설명을 우선합니다."); }
  if (p.bottlenecks.includes("C")){ if (!methods.includes("쉬운 한국어")) methods.push("쉬운 한국어"); why.push("교과 개념어(C) 병목이 있어 개념어 설명과 연결 구조를 보강합니다."); }
  if (BAND(g) !== "l5"){ methods.push("시각 자료"); why.push("인물 관계와 재판 절차가 있어 간단한 도식을 준비했습니다(기본 접힘)."); }
  if (subj.recheck_required || (subj.uncertainty_flags||[]).length){
    warns.push(`사회 교과 프로필(${subj.representative_level})에 ${[...(subj.uncertainty_flags||[]), subj.recheck_required?"재시행 필요":""].filter(Boolean).join(", ")} 표시가 있어 확정 수준으로 쓰지 않았습니다.`);
    qs.push("사회 교과 수준이 불확실합니다. 이 학생에게 쉬운 표현 펼침을 기본으로 켤까요?");
  }
  const t3 = Object.entries(P).flatMap(([k,b])=>b.sw.filter(x=>x[2].includes(BAND(g)) && SW_TIER[x[0]]==="3").map(x=>x[0]));
  if (false && t3.length){ warns.push(`교과 적응 한국어가 들어간 표현 ${t3.length}개를 바꿨습니다. 개념어 보존 원칙과 충돌할 수 있어 확인이 필요합니다.`); qs.push(`'${t3[0]}' 등 ${t3.length}개 표현을 원문 유지 + 괄호 설명으로 바꿀까요?`); }
  qs.push("모국어 병기는 대역표 검증 전입니다. 오역 판독을 실행할까요?");
  return {methods, why, warns, qs};
}

const JOSA = ["으로부터","에서는","에게서","으로","에서","에게","이다","하여","하고","하며","하는","하던","하다","한다","했다","하였다","할","한","된","은","는","이","가","을","를","의","에","와","과","로","도","만","적인","적"];
function lookup(raw){
  const w = raw.replace(/[\s.,!?'"“”‘’「」()·~:;]/g,"");
  if (!w) return null;
  const tryKey = k => T[k] ? {key:k, d:T[k], term:true} : (D[k] ? {key:k, d:D[k]} : null);
  let r = tryKey(w) || tryKey(raw.trim());
  if (r) return r;
  for (const j of JOSA){ if (w.length > j.length && w.endsWith(j)){ r = tryKey(w.slice(0,-j.length)); if (r) return r; } }
  const keys = [...Object.keys(T), ...Object.keys(D)].map(k=>k.replace(/ /g,"")).sort((a,b)=>b.length-a.length);
  for (const k of keys){ if (w.startsWith(k)){ const orig = Object.keys(T).find(x=>x.replace(/ /g,"")===k) || k; r = tryKey(orig); if (r) return r; } }
  return null;
}

function render(){

  $("misCnt").hidden = !(st.scan==="done" && left); $("misCnt").textContent = left;
  if (tv){

    $("headBtns").innerHTML = "";
  } else {
    const s = STU[st.stu];
    $("ctrlTitle").textContent = "사회 · 민사 재판";
    $("ctrlSub").textContent = (st.own ? "내가 넣은 자료 · 선생님 확인 전" : "선생님이 보낸 자료") + ` · ${s.name}에게 맞춘 ${s.lv} 자료 · 밑줄 친 말을 눌러 보세요`;
    $("headBtns").innerHTML = (showStu ? `<button type="button" class="hbtn g" data-host="s-study-list">← 자료 목록</button><button type="button" class="hbtn" data-host="s-quiz">다 읽었어요, 문제 풀기 →</button>` : `<button type="button" class="hbtn g" data-host="s-study-list">← 자료 목록</button>`);
  }
  $("teacher").hidden = !tv; $("page1").hidden = tv; $("page2").hidden = tv;
  document.querySelector(".toolbar").hidden = !showStu; $("footNote").hidden = !showStu;
  if (st.view==="make"){
    $("teacher").innerHTML = makeHTML();
    const show = st.mk === "review";
    $("page1").hidden = !show; $("page2").hidden = !show;
    if (show){
      const keep = {stu:st.stu, raw:st.raw, gloss:st.gloss, mark:st.mark};
      st.stu = st.mkG; st.raw = false; st.gloss = true; st.mark = true;
      $("page1").innerHTML = page1(); $("page2").innerHTML = page2() + reviewBar();
      Object.assign(st, keep);
      document.querySelectorAll(".page").forEach(p => p.classList.remove("noshow"));
    }
    return;
  }
  if (st.view==="check"){
    const sub = `<div class="subtabs"><button type="button" data-chk="gloss" aria-pressed="${st.chk==="gloss"}">변환 자료 병기 점검</button><button type="button" data-chk="tx" aria-pressed="${st.chk==="tx"}">외부 번역본 검사</button></div>`;
    if (st.chk==="tx"){ $("teacher").innerHTML = sub + txHTML(); $("page1").hidden = true; $("page2").hidden = true; return; }
    $("teacher").innerHTML = sub + teacherHTML();
    const show = st.scan === "done";
    $("page1").hidden = !show; $("page2").hidden = !show;
    if (show){
      const keep = {stu:st.stu, raw:st.raw, gloss:st.gloss, mark:st.mark};
      st.stu = LANGSTU[st.tlang]; st.raw = false; st.gloss = true; st.mark = true; TM = true;
      $("page1").innerHTML = page1(); $("page2").innerHTML = page2();
      TM = false; Object.assign(st, keep);
      document.querySelectorAll(".page").forEach(p => p.classList.remove("noshow"));
    }
    return;
  }
  if (!st.sent && !st.own){
    $("teacher").hidden = false; $("page1").hidden = true; $("page2").hidden = true;
    $("teacher").innerHTML = `<div class="empty"><b>선생님이 보낸 자료가 아직 없어요</b><p>선생님이 자료를 검토하고 승인하면 여기에 나타나요.</p><button type="button" class="btn s" data-host="t-material">교사 · 자료 재구성으로 가기 (시연용)</button></div>`;
    return;

  $("t-mark").setAttribute("aria-pressed", st.mark); $("t-gloss").setAttribute("aria-pressed", st.gloss); $("t-raw").setAttribute("aria-pressed", st.raw);
  $("page1").innerHTML = page1(); $("page2").innerHTML = page2();
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("noshow", !st.mark));
  mountInk();
  $("wcnt").textContent = st.saved.size;
}

document.addEventListener("input", e => { if (e.target.id && /^a\d/.test(e.target.id)) st.qa[e.target.id] = e.target.value; });
document.addEventListener("click", e => {
  const edb = e.target.closest("[data-edrid],[data-edcx],[data-edmore],[data-edvis]");
  if (edb){ e.stopPropagation();
    if (edb.dataset.edrid) openSwapEdit(edb.dataset.edrid);
    else if (edb.dataset.edcx) openAnnSheet({id:edb.dataset.edcx});
    else if (edb.dataset.edmore) openMoreEdit(edb.dataset.edmore);
    else openVisEdit(edb.dataset.edvis);
    return; }
  const cxe = e.target.closest("[data-cx]");
  if (cxe){
    const id = cxe.dataset.cx;
    const tg = k => { st.open.has(k)?st.open.delete(k):st.open.add(k); render(); };
    if (e.target.closest("[data-cxn]")){ tg("cxn-"+id); return; }
    if (e.target.closest("[data-cxv]")){ tg("cxv-"+id); return; }
    if (e.target.closest("[data-cxo]")){ tg("cxo-"+id); return; }
  }
  const s = e.target.closest("[data-stu]"); if (s){ st.stu = s.dataset.stu; st.open.clear(); st.qa = {}; render(); return; }
  const tm = e.target.closest("[data-term]"); if (tm){ openTerm(tm.dataset.term); return; }
  const nt = e.target.closest("[data-nt]"); if (nt){ const id = nt.dataset.nt; st.open.has(id)?st.open.delete(id):st.open.add(id); nt.classList.toggle("open"); return; }
  const sw = e.target.closest("[data-sw]");
  if (sw && (st.mark || st.view==="make")){ const id = sw.dataset.sw; st.open.has(id)?st.open.delete(id):st.open.add(id); sw.classList.toggle("open"); return; }
  const tg = e.target.closest("[data-tg]"); if (tg){ const id = tg.dataset.tg; st.open.has(id)?st.open.delete(id):st.open.add(id); render(); return; }
  const pk = e.target.closest("[data-pick]"); if (pk){
    const q = pk.dataset.pick, r = pk.dataset.role || ""; st.qa[q+r] = pk.dataset.v;
    if (q==="q1"){ st.qa.a1 = pk.dataset.v; }
    if (q==="q2"){ if (r==="원고") st.qa.a2a = pk.dataset.v; else st.qa.a2b = pk.dataset.v; }
    render();
    const fb = $("fb-"+q);
    if (q==="q1"){ const ok = pk.dataset.v===ANS.q1; fb.className="fb "+(ok?"ok":"no"); fb.textContent = ok?"맞았어요.":"다시 생각해 보세요. 211쪽 첫 문장을 읽어 보세요."; }
    if (q==="q2" && st.qa["q2원고"] && st.qa["q2피고"]){ const ok = st.qa["q2원고"]==="영감" && st.qa["q2피고"]==="농부"; fb.className="fb "+(ok?"ok":"no"); fb.textContent = ok?"맞았어요. 먼저 소송을 건 사람이 원고예요.":"다시 생각해 보세요. 누가 먼저 소송을 걸었나요?"; }
    return; }
});

function reportText(){
  const lines = ["[오역 판독 보고서] 사회 · 03 재판의 의미와 공정한 재판 (210~211쪽)","검사 모드: 병기 / 검사 언어: 중국어, 우즈베크어, 몽골어",""];
  MIS.forEach((m,i)=>lines.push(`${i+1}. ${m.sev} ${m.verdict} · ${m.term} (${LANGS[m.lang].split(" ")[0]})`,`   현재 병기: ${m.wrong} (${m.backWrong})`,`   올바른 말: ${m.right||"대역표 미등재"}`,`   이유: ${m.reason}`,`   추정 원인: ${m.cause}`,""));

    <p class="note" style="color:var(--sub)">밑줄·설명·쉬운 표현·그림을 누르면 펼쳐지고, 펼친 곳의 <b style="color:var(--title)">수정하기</b>로 고칠 수 있습니다. <b style="color:var(--title)">지면의 글자를 드래그하면 밑줄·설명·시각 자료를 직접 추가할 수 있습니다.</b>${myRev||myEd?` 이 그룹에서 되돌림 ${myRev}건, 직접 수정 ${myEd}건.`:""} 모국어 병기의 오역은 승인 전후 언제든 <button type="button" class="btn s" data-view="check" style="padding:2px 10px">오역 찾기</button>에서 점검할 수 있습니다.</p></div>${evidenceHTML(st.mkG)}`;
}

   ${ok?`<button type="button" class="btn s" id="mkUnapprove">승인 취소</button>`:`<button type="button" class="btn p" id="mkApprove">이 그룹 승인</button>`}

function runMake(){

function openSwapEdit(rid){

  $("sheetIn").innerHTML = `<div class="t"><span>${isNote(o,sw[1])?"추가 설명 수정":"밑줄(쉬운 표현) 수정"}</span><button type="button" class="x" id="sheetX" aria-label="닫기">✕</button></div>
   <dl><dt>원문</dt><dd>${esc(o)}</dd><dt>${isNote(o,sw[1])?"추가 설명":"바꾼 표현"}</dt><dd>${rev?"(원문으로 되돌림)":esc(isNote(o,sw[1])?noteText(o,cur):cur)}</dd><dt>대상</dt><dd>${STU[g].name} · ${STU[g].lv}</dd>${(()=>{const i=swapInfo(g,o,sw[1]); return `<dt>위계</dt><dd>${i.tier} ${TIER_NAME[i.tier]||""}${i.m!=null?` · 숙달 M${i.m}`:""}</dd><dt>처리</dt><dd>${i.op==="elaborate"?"원문 유지 + 추가 설명":"쉬운 표현으로 교체"}</dd><dt>근거</dt><dd>${esc(i.why)}</dd>${i.review?`<dt></dt><dd><span class="pill2 r">교사 확인 필요</span></dd>`:""}`;})()}</dl>
   <label class="note" for="editIn">직접 고치기</label><input class="editin" id="editIn" value="${esc(cur)}">
   <div class="row"><button type="button" class="btn p" id="edSave">고친 표현 저장</button>${rev?`<button type="button" class="btn s" id="edRestore">바꾼 표현 다시 쓰기</button>`:`<button type="button" class="btn s" id="edRevert">원문으로 되돌리기</button>`}</div>`;
  $("sheet").hidden = false; $("sheetX").onclick = closeSheet;
  $("edSave").onclick = () => { const v = $("editIn").value.trim(); if (!v){ toast("고칠 표현을 입력해 주세요"); return; } if (v===sw[1]) delete st.edits[rid]; else st.edits[rid] = v; st.reverted.delete(rid); st.approved.delete(g); closeSheet(); render(); toast("고친 표현을 저장했어요"); };
  const rv = $("edRevert"); if (rv) rv.onclick = () => { st.reverted.add(rid); st.approved.delete(g); closeSheet(); render(); toast("원문으로 되돌렸어요"); };
  const rs = $("edRestore"); if (rs) rs.onclick = () => { st.reverted.delete(rid); closeSheet(); render(); };
}
document.addEventListener("click", e => {
  const id = e.target.id;
  if (id==="runMake"){ runMake(); return; }
  if (id==="mkApprove"){ st.approved.add(st.mkG); const next = [...st.mkGroups].find(k=>!st.approved.has(k)); toast(`${STU[st.mkG].name} 그룹을 승인했어요`); if (next) st.mkG = next; render(); if (next) window.scrollTo({top:0, behavior:"smooth"}); return; }
  if (id==="mkUnapprove"){ st.approved.delete(st.mkG); render(); return; }
  if (id==="mkSend"){ st.sent = true; st.mk = "sent"; render(); window.scrollTo({top:0}); toast("최종본을 보냈어요"); post({type:"sent", groups:[...st.mkGroups].map(g=>STU[g].sid)}); return; }
  if (id==="mkNew"){ st.mk = "upload"; st.mkFile = null; st.approved.clear(); st.reverted.clear(); st.edits = {}; render(); return; }
  const sy = e.target.closest("[data-say]"); if (sy){ try{ const u = new SpeechSynthesisUtterance(sy.dataset.say); u.lang = "ko-KR"; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(err){ toast("읽어 주기를 시작하지 못했어요"); } return; }
  const mg = e.target.closest("[data-mkg]"); if (mg){ st.mkG = mg.dataset.mkg; render(); return; }
});

/* PDF 올리기 */
function takeFile(f){
  if (!f) return;
  const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
  if (!isPdf){ st.ferr = "PDF 파일만 올릴 수 있어요. 파일 형식을 확인해 주세요."; render(); return; }
  if (f.size > 20*1048576){ st.ferr = "20MB 이하 파일만 올릴 수 있어요. 쪽수를 나누어 올려 주세요."; render(); return; }
  st.mkFile = {name:f.name, size:f.size}; st.ferr = ""; render(); toast("PDF를 올렸어요");
}
document.addEventListener("change", e => {
  if (e.target.id==="pdfIn") takeFile(e.target.files && e.target.files[0]);
  if (e.target.name==="mksubj") st.mkSubj = e.target.value;
  if (e.target.dataset && e.target.dataset.mg){ e.target.checked ? st.mkGroups.add(e.target.dataset.mg) : st.mkGroups.delete(e.target.dataset.mg); render(); }
  if (e.target.dataset && e.target.dataset.fl){ e.target.checked ? st.flangs.add(e.target.dataset.fl) : st.flangs.delete(e.target.dataset.fl); render(); }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); takeFile(e.dataTransfer.files[0]); } });

/* 필기: 지면 위 투명 캔버스. 획은 지면 너비 기준 비율로 저장해 다시 그린다 */
function drawStroke(ctx, W, k){
  if (k.pts.length < 1) return;
  ctx.save(); ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = k.color; ctx.globalAlpha = k.tool==="hl" ? .32 : 1; ctx.lineWidth = (k.tool==="hl" ? 16 : 2.6);
  ctx.beginPath(); k.pts.forEach(([x,y],i)=> i ? ctx.lineTo(x*W, y*W) : ctx.moveTo(x*W, y*W));
  if (k.pts.length===1) ctx.lineTo(k.pts[0][0]*W+0.1, k.pts[0][1]*W);
  ctx.stroke(); ctx.restore();
}
function redrawInk(cv){
  const pg = cv.parentElement, W = pg.clientWidth, dpr = window.devicePixelRatio || 1, ctx = cv.getContext && cv.getContext("2d");
  if (!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  (st.ink[pg.id]||[]).forEach(k=>drawStroke(ctx, W, k));
}
function mountInk(){
  if (st.view !== "student" || !(st.sent || st.own)) return;
  document.querySelectorAll(".page").forEach(pg => {
    if (pg.hidden) return;
    let cv = pg.querySelector(":scope > canvas.inkc");
    if (!cv){ cv = document.createElement("canvas"); cv.className = "inkc"; cv.setAttribute("aria-hidden","true"); pg.appendChild(cv); bindInk(cv); }
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(pg.clientWidth*dpr); cv.height = Math.round(pg.scrollHeight*dpr); cv.style.height = pg.scrollHeight+"px";
    redrawInk(cv);
  });
}
function bindInk(cv){
  let cur = null;
  const pt = e => { const r = cv.getBoundingClientRect(), W = cv.parentElement.clientWidth; return [(e.clientX - r.left)/W, (e.clientY - r.top)/W]; };
  cv.addEventListener("pointerdown", e => {
    if (!st.drawing) return; e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    const id = cv.parentElement.id, p = pt(e);
    if (st.pen === "er"){ eraseAt(id, p); redrawInk(cv); cur = {erase:true}; return; }
    cur = {tool:st.pen, color:st.pcol, pts:[p]}; st.ink[id].push(cur); redrawInk(cv);
  });
  cv.addEventListener("pointermove", e => {
    if (!st.drawing || !cur) return; e.preventDefault();
    const id = cv.parentElement.id, p = pt(e);
    if (cur.erase){ if (eraseAt(id, p)) redrawInk(cv); return; }
    cur.pts.push(p); const ctx = cv.getContext("2d"), W = cv.parentElement.clientWidth, dpr = window.devicePixelRatio||1; ctx.setTransform(dpr,0,0,dpr,0,0); drawStroke(ctx, W, {...cur, pts:cur.pts.slice(-2)});
  });
  const end = () => { if (cur && !cur.erase) redrawInk(cv); cur = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end); cv.addEventListener("pointerleave", end);
}
function eraseAt(id, [x,y]){
  const r = 0.02, before = st.ink[id].length;
  st.ink[id] = st.ink[id].filter(k => !k.pts.some(([a,b]) => Math.hypot(a-x, b-y) < r));
  return st.ink[id].length !== before;
}
function setDrawing(on){
  st.drawing = on; document.body.classList.toggle("drawing", on); post({type:"drawing", on});
  $("penBar").hidden = !on; $("b-ink").setAttribute("aria-pressed", on);
  if (on){ $("annBar").hidden = true; $("findBtn").hidden = true; mountInk(); toast("필기를 시작했어요"); }
}
$("b-ink").onclick = () => setDrawing(!st.drawing);
$("inkDone").onclick = () => setDrawing(false);
$("inkClear").onclick = () => { st.ink = {page1:[], page2:[]}; mountInk(); toast("필기를 모두 지웠어요"); };
$("penBar").addEventListener("click", e => {
  const p = e.target.closest("[data-pen]"); if (p){ st.pen = p.dataset.pen; document.querySelectorAll("[data-pen]").forEach(b=>b.setAttribute("aria-pressed", b===p)); }
  const c = e.target.closest("[data-col]"); if (c){ st.pcol = c.dataset.col; document.querySelectorAll("[data-col]").forEach(b=>b.setAttribute("aria-pressed", b===c)); if (st.pen==="er"){ st.pen="pen"; document.querySelectorAll("[data-pen]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.pen==="pen")); } }
});
window.addEventListener("resize", () => { clearTimeout(window.__rs); window.__rs = setTimeout(mountInk, 200); });

/* 드래그(길게 눌러 선택)로 단어 찾기 */
let selText = "", selTimer;
let selKey = "";
function placeAt(el, rc){
  const w = el.offsetWidth || 220;
  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, rc.left + rc.width/2 - w/2)) + "px";
  const below = rc.bottom + 10, above = rc.top - 48;
  el.style.top = (below + 44 < window.innerHeight - 30 ? below : Math.max(8, above)) + "px";
}
function checkSel(){
  const fb = $("findBtn"), ab = $("annBar"); const sel = window.getSelection();
  if (st.drawing){ fb.hidden = true; ab.hidden = true; return; }
  if (!sel || sel.isCollapsed || !sel.rangeCount){ fb.hidden = true; ab.hidden = true; return; }
  if (st.view === "make"){
    fb.hidden = true;
    const t = sel.toString().replace(/\s+/g," ").trim();
    const el = n => n && (n.nodeType===1 ? n : n.parentElement);
    const b1 = el(sel.anchorNode) && el(sel.anchorNode).closest("[data-blk]"), b2 = el(sel.focusNode) && el(sel.focusNode).closest("[data-blk]");
    if (!t || t.length > 40 || !b1 || b1 !== b2 || !b1.closest(".page")){ ab.hidden = true; return; }
    selText = t; selKey = b1.dataset.blk; ab.hidden = false; placeAt(ab, sel.getRangeAt(0).getBoundingClientRect()); return;
  }
  ab.hidden = true;
  if (st.view !== "student"){ fb.hidden = true; return; }
  const t = sel.toString().trim();
  const node = sel.anchorNode && (sel.anchorNode.nodeType===1 ? sel.anchorNode : sel.anchorNode.parentElement);
  if (!t || t.length > 20 || /\n/.test(t) || !node || !node.closest(".page") || node.closest("input,textarea")){ fb.hidden = true; return; }
  const rc = sel.getRangeAt(0).getBoundingClientRect();
  selText = t; fb.hidden = false;
  const w = fb.offsetWidth || 110;
  fb.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, rc.left + rc.width/2 - w/2)) + "px";
  const below = rc.bottom + 10, above = rc.top - 44;
  fb.style.top = (below + 40 < window.innerHeight - 90 ? below : Math.max(8, above)) + "px";
}
document.addEventListener("selectionchange", () => { clearTimeout(selTimer); selTimer = setTimeout(checkSel, 250); });
window.addEventListener("scroll", () => { if (!$("findBtn").hidden || !$("annBar").hidden) checkSel(); }, {passive:true});
$("annBar").addEventListener("mousedown", e => e.preventDefault());
$("annBar").addEventListener("click", e => {
  const b = e.target.closest("[data-addfx]"); if (!b) return;
  $("annBar").hidden = true; const t = selText, key = selKey;
  try{ window.getSelection().removeAllRanges(); }catch(err){}
  const src = blkSource(key, st.mkG);
  const isTermSel = !!T[t] && P[key].o.includes("[["+t+"]]") && !src.includes(t.length ? "" : "x");
  const exist = (st.ann[st.mkG]||[]).find(a=>a.key===key && a.phrase===t);
  if (exist){ openAnnSheet({id:exist.id}); return; }
  if (src.indexOf(t) < 0 && !(T[t] && src.includes("[["+t+"]]"))){ toast("이미 바뀐 표현이 섞여 있어요. 원문 그대로인 부분만 골라 주세요"); return; }
  openAnnSheet({key, phrase:t, preset:b.dataset.addfx});
});
$("findBtn").addEventListener("mousedown", e => e.preventDefault());
$("findBtn").onclick = () => { $("findBtn").hidden = true; const t = selText; try{ window.getSelection().removeAllRanges(); }catch(err){} openFind(t); };
/* ── 팀원 앱(index.html)과 연결: 부모가 보기·학생을 정하고, 이 화면은 이동을 부모에게 알린다 ── */
function post(msg){ try{ if (window.parent && window.parent !== window) window.parent.postMessage(Object.assign({src:"gnd-convert"}, msg), "*"); }catch(err){} }
function hostView(v, sid, own){
  const g = sid && SID2G[sid];
  const same = st.view === v && (!g || st.stu === g) && (own === undefined || st.own === own);
  if (same) return;
  if (st.drawing) setDrawing(false);
  closeSheet(); $("findBtn").hidden = true; $("annBar").hidden = true;
  st.view = v; if (g && g !== st.stu){ st.stu = g; st.open.clear(); st.qa = {}; }
  if (own !== undefined) st.own = own;
  render(); window.scrollTo({top:0});
}
window.addEventListener("message", e => {
  const d = e.data; if (!d || d.src !== "gnd-host") return;
  if (d.type === "view") hostView(d.view, d.sid, d.own);
});
document.addEventListener("click", e => {
  const h = e.target.closest("[data-host]"); if (!h) return;
  e.preventDefault(); e.stopPropagation();
  const to = h.dataset.host;
  if (window.parent === window){ /* 앱 안 iframe이 아니라 단독으로 열렸을 때 */
    if (to === "t-material") hostView("make");
    else if (to === "s-study") hostView("student", STU[[...st.mkGroups][0]].sid, !st.sent);
    else if (to === "s-quiz") location.href = "/app/quizzes";
    else location.href = "/app/materials";
    return;
  }
  post({type:"route", to, sid: to.startsWith("s-") ? STU[to==="s-study" ? [...st.mkGroups][0] : st.stu].sid : undefined});
}, true);
/* 처음 열 때 주소의 ?view=&sid= 로 시작 화면을 정한다 */
(function(){
  const q = new URLSearchParams(location.search);
  if (q.get("view")) st.view = q.get("view");
  if (q.get("sid") && SID2G[q.get("sid")]) st.stu = SID2G[q.get("sid")];
  if (q.get("own")) st.own = true;
})();
render();
routeHash();
post({type:"ready"});
</script>
